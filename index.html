  <style>
    /* ==========================================
       7ORVIX OFFICIAL DESIGN SYSTEM & THEMING
       ========================================== */
    :root {
      --canvas: #080909;
      --surface: #111214;
      --brand: #FF3301;
      --brand-hover: #FF5522;
      --brand-glow: rgba(255, 51, 1, 0.35);
      --ink: #F0F2F5;
      --ink-muted: #B8BEC8;
      --ink-subtle: #6E7585;
      --hairline: rgba(255, 255, 255, 0.08);
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--canvas);
      color: var(--ink);
      font-family: var(--font-body);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Fullscreen Viewport Container */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3rem 4rem;
      background: radial-gradient(circle at 50% 45%, #14161f 0%, var(--canvas) 70%);
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    .viewport:active {
      cursor: grabbing;
    }

    /* Ambient Glow Behind Stage */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65vw;
      height: 65vw;
      max-width: 800px;
      max-height: 800px;
      background: radial-gradient(circle, var(--brand-glow) 0%, rgba(255, 51, 1, 0.03) 45%, transparent 70%);
      pointer-events: none;
      filter: blur(85px);
      opacity: 0.65;
      border-radius: 50%;
    }

    /* Fullscreen SVG Overlay for Ambient Particles */
    .full-screen-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
      overflow: visible;
    }

    /* Header & Navigation Area */
    .header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      pointer-events: auto;
    }

    .brand-link {
      display: inline-block;
      text-decoration: none;
      outline: none;
    }

    .nav-svg-logo {
      width: 148px;
      height: auto;
      display: block;
      filter: drop-shadow(0 2px 10px rgba(255, 51, 1, 0.2));
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.25s ease;
    }

    .brand-link:hover .nav-svg-logo {
      transform: scale(1.04);
      filter: drop-shadow(0 4px 18px rgba(255, 51, 1, 0.5));
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.45rem 1.15rem;
      background: rgba(17, 18, 20, 0.75);
      border: 1px solid var(--hairline);
      border-radius: 100px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--brand);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--brand);
      animation: pulse-ring 2.2s infinite ease-in-out;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.4; }
    }

    .status-text {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--ink-muted);
    }

    /* CENTERPIECE: MOVABLE 7ORVIX LOGO STAGE */
    .logo-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: none;
    }

    /* Dynamic Movable 7ORVIX Logo SVG */
    .floating-logo-svg {
      width: 90%;
      max-width: 940px;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 35px rgba(255, 51, 1, 0.28));
      transform-origin: center center;
      will-change: transform;
      pointer-events: auto;
    }

    .logo-path {
      transform-origin: center;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Footer */
    .footer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--ink-subtle);
      text-transform: uppercase;
      z-index: 10;
      pointer-events: none;
    }

    /* Static state for Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .bg-glow, .status-dot, .floating-logo-svg {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 768px) {
      .viewport {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>

  <!-- ==========================================
       VANILLA JS REALISTIC FLUID PHYSICS ENGINE
       ========================================== -->
  <script>
    (function() {
      'use strict';

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // DOM Elements
      const viewport = document.getElementById('viewport');
      const floatingLogo = document.getElementById('floating-logo');
      const fullSvg = document.getElementById('full-svg');
      const particlesGroup = document.getElementById('particles-group');
      const feDisp = document.getElementById('fe-disp');
      const feTurb = document.getElementById('fe-turb');
      const bgGlow = document.getElementById('bg-glow');

      // Setup Fullscreen SVG ViewBox
      function syncSvgDimensions() {
        fullSvg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      }
      syncSvgDimensions();
      window.addEventListener('resize', syncSvgDimensions);

      // Object Dynamic Center State
      let centerX = window.innerWidth / 2;
      let centerY = window.innerHeight * 0.46;

      window.addEventListener('resize', () => {
        centerX = window.innerWidth / 2;
        centerY = window.innerHeight * 0.46;
      });

      const bodyState = {
        x: centerX,
        y: centerY,
        vx: 0,
        vy: 0,
        angle: 0,
        vAngle: 0,
        isDragging: false,
        dragOffsetX: 0,
        dragOffsetY: 0
      };

      // Ambient Drifting Particles Array
      const particles = [];
      const NUM_PARTICLES = 20;

      for (let i = 0; i < NUM_PARTICLES; i++) {
        const p = {
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          radius: 1.2 + Math.random() * 2.2,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -0.15 - Math.random() * 0.3,
          baseOpacity: 0.12 + Math.random() * 0.35,
          phase: Math.random() * Math.PI * 2,
          element: null
        };

        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("r", p.radius.toFixed(1));
        circle.setAttribute("fill", "rgba(255, 255, 255, 0.35)");
        circle.setAttribute("filter", "blur(0.5px)");
        particlesGroup.appendChild(circle);
        p.element = circle;

        particles.push(p);
      }

      // Pointer Event Handlers
      viewport.addEventListener('pointerdown', (e) => {
        bodyState.isDragging = true;
        bodyState.dragOffsetX = e.clientX - bodyState.x;
        bodyState.dragOffsetY = e.clientY - bodyState.y;
      });

      window.addEventListener('pointermove', (e) => {
        if (bodyState.isDragging) {
          const targetX = e.clientX - bodyState.dragOffsetX;
          const targetY = e.clientY - bodyState.dragOffsetY;

          bodyState.vx = (targetX - bodyState.x) * 0.25;
          bodyState.vy = (targetY - bodyState.y) * 0.25;

          bodyState.x = targetX;
          bodyState.y = targetY;
        } else {
          // Subtle cursor proximity push
          const dx = e.clientX - bodyState.x;
          const dy = e.clientY - bodyState.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 180 && dist > 1) {
            const push = (180 - dist) / 180;
            bodyState.vx -= (dx / dist) * push * 0.4;
            bodyState.vy -= (dy / dist) * push * 0.4;
          }
        }

        // Ambient radial background glow movement
        if (bgGlow) {
          const glowX = (e.clientX - window.innerWidth / 2) * 0.04;
          const glowY = (e.clientY - window.innerHeight / 2) * 0.04;
          bgGlow.style.transform = `translate(calc(-50% + ${glowX}px), calc(-50% + ${glowY}px))`;
        }
      });

      window.addEventListener('pointerup', () => {
        if (bodyState.isDragging) {
          bodyState.isDragging = false;
        }
      });

      // Realistic Physics Engine Loop
      let time = 0;

      function updatePhysics() {
        time += 0.016; // Stable 60fps time step

        // 1. Organic Water Bobbing Motion (Gentle Floating Sine Waves)
        const floatX = Math.sin(time * 0.7) * 10 + Math.cos(time * 1.2) * 4;
        const floatY = Math.sin(time * 0.9) * 12 + Math.sin(time * 0.45) * 4;

        const targetCenterX = centerX + floatX;
        const targetCenterY = centerY + floatY;

        if (!bodyState.isDragging) {
          // Soft Restoring Spring force toward floating center point (realistic, heavy fluid)
          const K_CENTER = 0.015;
          bodyState.vx += (targetCenterX - bodyState.x) * K_CENTER;
          bodyState.vy += (targetCenterY - bodyState.y) * K_CENTER;
        }

        // 2. 4-SIDE ELASTIC EDGE LIMIT SPRINGS (Smooth rubber-band cushion)
        const PAD_X = 220; // Horizontal boundary
        const PAD_Y = 110; // Vertical boundary
        const K_EDGE = 0.06; // Soft non-squishy spring strength

        const screenW = window.innerWidth;
        const screenH = window.innerHeight;

        // Left Boundary Spring
        if (bodyState.x < PAD_X) {
          const overlap = PAD_X - bodyState.x;
          bodyState.vx += Math.pow(overlap, 1.1) * K_EDGE;
        }
        // Right Boundary Spring
        if (bodyState.x > screenW - PAD_X) {
          const overlap = bodyState.x - (screenW - PAD_X);
          bodyState.vx -= Math.pow(overlap, 1.1) * K_EDGE;
        }
        // Top Boundary Spring
        if (bodyState.y < PAD_Y) {
          const overlap = PAD_Y - bodyState.y;
          bodyState.vy += Math.pow(overlap, 1.1) * K_EDGE;
        }
        // Bottom Boundary Spring
        if (bodyState.y > screenH - PAD_Y) {
          const overlap = bodyState.y - (screenH - PAD_Y);
          bodyState.vy -= Math.pow(overlap, 1.1) * K_EDGE;
        }

        // 3. APPLY HEAVY FLUID DRAG & INTEGRATE POSITION
        const HEAVY_FLUID_DRAG = 0.945;
        bodyState.vx *= HEAVY_FLUID_DRAG;
        bodyState.vy *= HEAVY_FLUID_DRAG;

        if (!bodyState.isDragging) {
          bodyState.x += bodyState.vx;
          bodyState.y += bodyState.vy;
        }

        // Roll Torque Alignment (Subtle fluid tilt)
        const targetRoll = (bodyState.vx * 0.008);
        bodyState.vAngle = (bodyState.vAngle + (targetRoll - bodyState.angle) * 0.04) * 0.88;
        bodyState.angle += bodyState.vAngle;

        // 4. RENDER LOGO TRANSFORM (Solid, realistic 1:1 scale with fluid translation & tilt)
        const offsetX = bodyState.x - centerX;
        const offsetY = bodyState.y - centerY;
        const angleDeg = (bodyState.angle * 180 / Math.PI).toFixed(2);

        floatingLogo.style.transform = `
          translate3d(${offsetX.toFixed(2)}px, ${offsetY.toFixed(2)}px, 0px)
          rotate(${angleDeg}deg)
        `;

        // Modulate subtle liquid turbulence refraction
        const speed = Math.hypot(bodyState.vx, bodyState.vy);
        if (feDisp) {
          const dispScale = (6 + Math.min(speed * 0.8, 8)).toFixed(1);
          feDisp.setAttribute("scale", dispScale);
        }
        if (feTurb) {
          const freqX = (0.006 + Math.sin(time * 0.3) * 0.0015).toFixed(4);
          const freqY = (0.012 + Math.cos(time * 0.5) * 0.002).toFixed(4);
          feTurb.setAttribute("baseFrequency", `${freqX} ${freqY}`);
        }

        // 5. RENDER AMBIENT BUBBLES
        particles.forEach(p => {
          p.x += p.vx + Math.sin(time + p.phase) * 0.2;
          p.y += p.vy;

          if (p.y < -20) {
            p.y = window.innerHeight + 20;
            p.x = Math.random() * window.innerWidth;
          }

          const opacity = (p.baseOpacity + Math.sin(time * 2.5 + p.phase) * 0.12).toFixed(2);
          p.element.setAttribute("cx", p.x.toFixed(1));
          p.element.setAttribute("cy", p.y.toFixed(1));
          p.element.setAttribute("opacity", Math.max(0.04, opacity));
        });

        if (!prefersReducedMotion) {
          requestAnimationFrame(updatePhysics);
        }
      }

      // Start Physics Loop
      if (prefersReducedMotion) {
        floatingLogo.style.transform = `translate3d(0px, 0px, 0px)`;
      } else {
        requestAnimationFrame(updatePhysics);
      }

    })();
  </script>
